# Pages CMS configuration (https://pagescms.org)
# Sign in at https://app.pagescms.org with GitHub, pick this repo, and you
# get a web editor for blog posts — every save commits to the repo and
# triggers the GitHub Pages deploy. See docs/publishing.md.

media:
  input: public/images/blog
  output: /images/blog

content:
  - name: posts
    label: Blog posts
    type: collection
    path: src/pages/blog
    format: yaml-frontmatter
    view:
      fields: [title, date, category]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: layout
        label: Layout (do not change)
        type: string
        default: ../../layouts/BlogPost.astro
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description (shown on /blog/ and in search results)
        type: text
      - name: category
        label: Category
        type: string
        default: Research Notes
      - name: date
        label: Date
        type: date
      - name: body
        label: Body
        type: rich-text
